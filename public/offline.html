<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — ORVIQO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a10;color:#eae8e3;font-family:system-ui,-apple-system,sans-serif;
    min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;
    background-image:radial-gradient(55% 45% at 50% 38%, rgba(255,139,61,.13), transparent 65%)}
  .orb{width:74px;height:74px;margin:0 auto 2rem;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, transparent 46%, rgba(255,139,61,.95) 54%, rgba(255,139,61,.14) 68%, transparent 74%);
    animation:pulse 3.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
  h1{font-size:1.6rem;font-weight:600;letter-spacing:-.01em;margin-bottom:.75rem}
  p{color:#8f8e96;max-width:34ch;margin:0 auto 2rem;line-height:1.65}
  a{display:inline-block;background:#eae8e3;color:#0a0a10;text-decoration:none;
    font-weight:600;padding:.85rem 1.75rem;border-radius:999px;font-size:.95rem}
  .mark{margin-top:3rem;font-size:.7rem;letter-spacing:.24em;color:#8f8e96}
  @media (prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
  <main>
    <div class="orb"></div>
    <h1>You're offline.</h1>
    <p>The connection dropped. Reconnect and we'll pick up exactly where you left off.</p>
    <a href="/">Try again</a>
    <p class="mark">ORVIQO</p>
  </main>
</body>
</html>
